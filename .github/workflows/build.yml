name: Auto Build Multi-Platform Executable Binariy file

on: [push]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            python-version: "3.13"
          - os: windows-2022
            arch: x86_64
            python-version: "3.13"
          - os: macos-15
            arch: arm64
            python-version: "3.13"
          - os: macos-15-intel
            arch: x86_64
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Requirements
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Activate .venv for subsequent steps
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify active Python
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.prefix)"

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/campus_network_autoauth/main.py
          mode: onefile
          output-dir: dist
          output-file: campus-network-autoauth
          assume-yes-for-downloads: true
          nofollow-import-to: |
            *.tests
            *.distutils
            unittest
            pytest
            setuptools

      - name: Rename artifacts by platforms
        shell: bash
        run: |
          mkdir -p dist_artifacts
          ls -RF dist/
          ARCH="${{ matrix.arch }}"
          OS="${{ matrix.os }}"

          if [ "$OS" == "windows-2022" ]; then
            mv dist/campus-network-autoauth dist_artifacts/campus-network-autoauth_windows-$ARCH.exe
          elif [ "$OS" == "ubuntu-24.04" ]; then
            mv dist/campus-network-autoauth dist_artifacts/campus-network-autoauth_linux-$ARCH.bin
          elif [ "${{ runner.os }}" == "macOS" ]; then
            mv dist/campus-network-autoauth dist_artifacts/campus-network-autoauth_darwin-$ARCH.bin
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: campus-network-autoauth_${{ matrix.os }}-${{ matrix.arch }}
          path: dist_artifacts/
