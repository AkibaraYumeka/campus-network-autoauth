name: Auto Build Multi-Platform Executable Binaries file

on: [push]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_os: linux
            arch: x86_64
            python-version: "3.13"
          - os: windows-2022
            artifact_os: windows
            arch: x86_64
            python-version: "3.13"
          - os: macos-15
            artifact_os: darwin
            arch: arm64
            python-version: "3.13"
          - os: macos-15-intel
            artifact_os: darwin
            arch: x86_64
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Requirements
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --group dev --no-editable

      - name: Activate .venv for subsequent steps
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify active Python
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.prefix)"

      - name: Build with Nuitka
        shell: bash
        run: |
          uv run --no-sync python -m nuitka --version
          uv run --no-sync python -m nuitka \
            --include-distribution-metadata=campus-network-autoauth \
            --onefile \
            --output-dir=dist \
            --output-filename=campus-network-autoauth \
            --assume-yes-for-downloads \
            --python-flag=-m \
            --nofollow-import-to="*.tests" \
            --nofollow-import-to="*.distutils" \
            --nofollow-import-to=unittest \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            src/campus_network_autoauth

      - name: Rename artifacts by platforms
        shell: bash
        run: |
          mkdir -p dist_artifacts
          ls -RF dist/
          ARCH="${{ matrix.arch }}"
          OS="${{ matrix.artifact_os }}"

          case "$OS" in
            windows)        EXT=".exe" ;;
            linux|darwin)   EXT=".bin" ;;
            *)              EXT=""     ;;
          esac

          mv "dist/campus-network-autoauth" "dist_artifacts/campus-network-autoauth-${OS}-${ARCH}${EXT}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: campus-network-autoauth-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: dist_artifacts/
