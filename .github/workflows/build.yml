name: Auto Build Multi-Platform Python Project

on: [push]

jobs:
  build:

    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: requirements
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/campus_network_autoauth/main.py
          mode: onefile
          output-dir: dist
          assume-yes-for-downloads: true
          follow-imports: true

      # - name: Rename artifacts by platforms
      #   shell: bash
      #   run: |
      #     mkdir -p dist_artifacts
      #     if [ "${{ runner.os }}" == "Windows" ]; then
      #       mv dist/myapp.exe dist_artifacts/myapp-${{ runner.os }}.exe
      #     else
      #       mv dist/myapp dist_artifacts/myapp-${{ runner.os }}
      #     fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/

