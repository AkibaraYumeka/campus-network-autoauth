[project]
name = "campus-network-autoauth"
version = "1.4.6"
description = "An auto-login script for Dr.COM campus network authentication."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "AkibaraYumeka", email = "AkibaraYumeka@outlook.jp" }
]
dependencies = [
    "fake-useragent>=2.2.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "tomlkit>=0.15.2",
]

[project.scripts]
campus-network-autoauth = "campus_network_autoauth:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
